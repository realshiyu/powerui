name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - name: Package
        shell: pwsh
        run: .\package.ps1
      - name: Upload portable EXE and ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PowerUI-win11-x64
          path: |
            artifacts/portable/PowerUI.exe
            artifacts/PowerUI-*.zip
          if-no-files-found: error
          retention-days: 14

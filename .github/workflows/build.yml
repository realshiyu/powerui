name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - name: Package
        shell: pwsh
        run: .\package.ps1
      - name: Upload portable EXE and ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PowerUI-win11-x64
          path: |
            artifacts/portable/PowerUI.exe
            artifacts/PowerUI-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package release
        shell: pwsh
        run: |
          .\build.ps1
          .\package.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $changelog = Get-Content CHANGELOG.md -Raw
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $section = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($version) + ' - [^\r\n]+\r?\n(.*?)(?=^## |\z)')
          if (-not $section.Success) { throw "Missing changelog for $version" }
          $notes = $section.Groups[1].Value.Trim()
          gh release create $env:GITHUB_REF_NAME artifacts/portable/PowerUI.exe artifacts/PowerUI-0.1-win11-x64.zip --verify-tag --title "PowerUI $env:GITHUB_REF_NAME" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
